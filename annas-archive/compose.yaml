services:
  annas-archive-api:
    build:
      context: .
      args:
        UPSTREAM_SHA: a6edc549985713a422efd0e19f2c093c417ed70c
    image: annas-archive-api:local
    container_name: annas-archive-api
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 384m
    cpus: 1
    environment:
      PORT: "3000"
      ANNAS_BASE_URL: https://annas-archive.gd
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.services.annas.loadbalancer.server.port=3000
      # The owner's raw API, now on the books host, still behind the key gate. It is the only route
      # that prefix, and it wins over the site router by priority.
      - traefik.http.routers.annas-api.rule=Host(`books.1000110.xyz`) && PathPrefix(`/api`)
      - traefik.http.routers.annas-api.entrypoints=websecure
      - traefik.http.routers.annas-api.tls.certresolver=cloudflare
      - traefik.http.routers.annas-api.priority=100
      - traefik.http.routers.annas-api.middlewares=annas-key
      - traefik.http.routers.annas-api.service=annas
      - traefik.http.middlewares.annas-key.forwardauth.address=http://annas-gate:8080/check

  # forwardAuth gate: 200 only for `Authorization: Bearer <the owner's key>`. It compares the
  # SHA-256 of the token, so the plaintext key never reaches the server (see README.md).
  annas-gate:
    image: annas-archive-api:local
    container_name: annas-gate
    restart: unless-stopped
    command: ["node", "/app/gate.mjs"]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    env_file: .env
    environment:
      PORT: "8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [proxy]

  # The family site: Hungarian UI, Pocket ID login, its own queue and worker. `/api` above stays the
  # owner's. The worker mints a DDoS-Guard clearance cookie with the bundled Chromium when needed,
  # so the image is large but idle.
  annas-web:
    build:
      context: ./web
    image: annas-books:local
    container_name: annas-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    env_file: .env
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://books.1000110.xyz
      ANNAS_BASE_URL: https://annas-archive.gd
    volumes:
      - books-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.services.books.loadbalancer.server.port=8000
      - traefik.http.routers.books.rule=Host(`books.1000110.xyz`)
      - traefik.http.routers.books.entrypoints=websecure
      - traefik.http.routers.books.tls.certresolver=cloudflare
      - traefik.http.routers.books.priority=10
      - traefik.http.routers.books.service=books
      # The old host keeps working as a redirect, so bookmarks and the e-reader do not break.
      - traefik.http.routers.annas-redirect.rule=Host(`annas.1000110.xyz`)
      - traefik.http.routers.annas-redirect.entrypoints=websecure
      - traefik.http.routers.annas-redirect.tls.certresolver=cloudflare
      - traefik.http.routers.annas-redirect.middlewares=annas-to-books
      - traefik.http.routers.annas-redirect.service=books
      - traefik.http.middlewares.annas-to-books.redirectregex.regex=^https://annas\.1000110\.xyz/(.*)
      - traefik.http.middlewares.annas-to-books.redirectregex.replacement=https://books.1000110.xyz/$1
      - traefik.http.middlewares.annas-to-books.redirectregex.permanent=true

volumes:
  books-data:

networks:
  proxy:
    external: true