services:
  web:
    image: nginx:alpine
    container_name: 1000110-xyz
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 64m
    cpus: 0.5
    volumes:
      - ./dist:/usr/share/nginx/html:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.site.rule=Host(`1000110.xyz`)
      - traefik.http.routers.site.entrypoints=websecure
      - traefik.http.routers.site.tls.certresolver=cloudflare
      - traefik.http.services.site.loadbalancer.server.port=80
networks:
  proxy:
    external: true
