services:
  uptime-kuma:
    # Pinned on purpose: Kuma's status-page JSON is internal and can change between versions.
    image: louislam/uptime-kuma:2.5.9
    container_name: uptime-kuma
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    volumes:
      - ./data:/app/data
    networks: [proxy]
    labels:
      - traefik.enable=true
      # Admin UI: its own subdomain, behind tinyauth.
      - traefik.http.routers.kuma-admin.rule=Host(`kuma.1000110.xyz`)
      - traefik.http.routers.kuma-admin.entrypoints=websecure
      - traefik.http.routers.kuma-admin.tls.certresolver=cloudflare
      - traefik.http.routers.kuma-admin.middlewares=tinyauth
      - traefik.http.routers.kuma-admin.service=kuma
      # Status JSON for the tools/status page: GET only, behind tinyauth (owner only), nothing else of Kuma is reachable here.
      - traefik.http.routers.kuma-status.rule=Host(`1000110.xyz`) && PathPrefix(`/api/status-page`) && Method(`GET`)
      - traefik.http.routers.kuma-status.priority=100
      - traefik.http.routers.kuma-status.entrypoints=websecure
      - traefik.http.routers.kuma-status.tls.certresolver=cloudflare
      - traefik.http.routers.kuma-status.middlewares=tinyauth
      - traefik.http.routers.kuma-status.service=kuma
      - traefik.http.services.kuma.loadbalancer.server.port=3001
networks:
  proxy:
    external: true
