services:
  # The family site: Hungarian UI, Pocket ID login, its own queue and worker. The worker mints a
  # DDoS-Guard clearance cookie with the bundled Chromium when needed, so the image is large but
  # idle. Nothing else runs in this stack: the books app talks to Anna's Archive and Libgen itself.
  annas-web:
    build:
      context: ./web
    image: annas-books:local
    container_name: annas-web
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 1
    env_file: .env
    environment:
      DATA_DIR: /data
      PUBLIC_URL: https://books.1000110.xyz
      ANNAS_BASE_URL: https://annas-archive.gd
    volumes:
      - books-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.services.books.loadbalancer.server.port=8000
      - traefik.http.routers.books.rule=Host(`books.1000110.xyz`)
      - traefik.http.routers.books.entrypoints=websecure
      - traefik.http.routers.books.tls.certresolver=cloudflare
      - traefik.http.routers.books.priority=10
      - traefik.http.routers.books.service=books
      # The old host keeps working as a redirect, so bookmarks and the e-reader do not break.
      - traefik.http.routers.annas-redirect.rule=Host(`annas.1000110.xyz`)
      - traefik.http.routers.annas-redirect.entrypoints=websecure
      - traefik.http.routers.annas-redirect.tls.certresolver=cloudflare
      - traefik.http.routers.annas-redirect.middlewares=annas-to-books
      - traefik.http.routers.annas-redirect.service=books
      - traefik.http.middlewares.annas-to-books.redirectregex.regex=^https://annas\.1000110\.xyz/(.*)
      - traefik.http.middlewares.annas-to-books.redirectregex.replacement=https://books.1000110.xyz/$1
      - traefik.http.middlewares.annas-to-books.redirectregex.permanent=true

volumes:
  books-data:

networks:
  proxy:
    external: true