name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      stack:
        description: "Deploy this stack at this commit (a name from stacks/manifest.json; run it from main)"
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  sc2bp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: sc2bp/requirements-dev.txt
      - run: pip install -r sc2bp/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: sc2bp

  stacks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: stacks/requirements-dev.txt
      - run: pip install -r stacks/requirements-dev.txt
      - run: python stacks/lint.py
      - run: python -m pytest -q
        working-directory: stacks
      - run: python -m pytest -q
        working-directory: kuma

  deploy:
    needs: [check, sc2bp, stacks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Sync dist/ to server
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rltz --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "deploy@${HOST}:."

  # Which stacks does this push deploy? stacks/changed.py decides (tested): `auto` stacks with a copied file changed,
  # or the stack named in a manual run. Pull requests never get here, so the secrets never reach them.
  stacks-changed:
    needs: [check, sc2bp, stacks]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      any: ${{ steps.pick.outputs.any }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          STACK: ${{ inputs.stack }}
        run: python3 stacks/changed.py --before "$BEFORE" --sha "$SHA" --stack "$STACK" | tee -a "$GITHUB_OUTPUT"

  # One stack at a time, stopping at the first failure. Stacks marked `approval` use the `production-approval`
  # Environment, which waits for the owner. The server (stack-deploy) does the real checks; see DECISIONS.md.
  deploy-stacks:
    needs: stacks-changed
    if: needs.stacks-changed.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix: ${{ fromJSON(needs.stacks-changed.outputs.matrix) }}
    environment: ${{ matrix.approval && 'production-approval' || 'production' }}
    concurrency:
      group: deploy-stack-${{ matrix.stack }}
      cancel-in-progress: false
    steps:
      - name: plan, then deploy ${{ matrix.stack }}
        env:
          KEY: ${{ secrets.STACKDEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          STACK: ${{ matrix.stack }}
          SHA: ${{ github.sha }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077; echo "$KEY" > ~/.ssh/stack_key)
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh_stack() { ssh -i ~/.ssh/stack_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes "stackdeploy@${HOST}" "$1"; }
          echo "::group::plan $STACK"
          ssh_stack "plan $STACK $SHA"
          echo "::endgroup::"
          ssh_stack "$STACK $SHA"
