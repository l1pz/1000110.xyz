services:
  web:
    image: nginx:alpine
    container_name: rsystem2005-hu
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    mem_limit: 64m
    cpus: 0.5
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.http.routers.rsystem2005-hu.rule=Host(`rsystem2005.hu`) || Host(`www.rsystem2005.hu`)
      - traefik.http.routers.rsystem2005-hu.entrypoints=websecure
      - traefik.http.routers.rsystem2005-hu.tls.certresolver=cloudflare
      - traefik.http.routers.rsystem2005-hu.middlewares=rsystem2005-hu-www
      - traefik.http.middlewares.rsystem2005-hu-www.redirectregex.regex=^https://www\.rsystem2005.hu/(.*)
      - traefik.http.middlewares.rsystem2005-hu-www.redirectregex.replacement=https://rsystem2005.hu/$${1}
      - traefik.http.middlewares.rsystem2005-hu-www.redirectregex.permanent=true
      - traefik.http.services.rsystem2005-hu.loadbalancer.server.port=80
networks:
  proxy:
    external: true
